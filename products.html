<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | Sai Sales</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-dashboard.css?v=20260511-mobile-menu">
</head>
<body>
  <div class="admin-shell">
    <aside class="sidebar" aria-label="Products navigation">
      <div class="logo-wrap"><div class="logo-orbit" aria-hidden="true"></div></div>
      <nav class="side-nav">
        <a href="dashboard.html"><span class="nav-icon grid-icon" aria-hidden="true"></span><span>Dashboard</span></a>
        <a href="admin-dashboard.html" data-admin-only><span class="nav-icon chart-icon" aria-hidden="true"></span><span>Inventory</span></a>
        <a class="active" href="products.html"><span class="nav-icon book-icon" aria-hidden="true"></span><span>Products</span></a>
        <a href="suppliers.html"><span class="nav-icon supplier-icon" aria-hidden="true"></span><span>Suppliers</span></a>
        <a href="users.html" data-admin-only><span class="nav-icon staff-icon" aria-hidden="true"></span><span>Staff Management</span></a>
        <a href="stock-out.html"><span class="nav-icon cart-icon" aria-hidden="true"></span><span>Stock Out</span></a>
        <a href="stock-in.html"><span class="nav-icon safety-icon" aria-hidden="true"></span><span>Stock In</span></a>
        <a href="reports.html" data-admin-only><span class="nav-icon report-icon" aria-hidden="true"></span><span>Reports & Analysis</span></a>
        <a href="#" data-admin-only><span class="nav-icon settings-icon" aria-hidden="true"></span><span>Settings</span></a>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div><h1>Products</h1><p>Create and manage inventory items</p></div>
        <div class="top-actions">
          <label class="search-box" for="globalSearch"><span aria-hidden="true"></span><input id="globalSearch" type="search" placeholder="Search"></label>
          <button class="notification-button" type="button" aria-label="Notifications"><span></span></button>
          <button class="profile-button" type="button" onclick="logout()"><span class="avatar" aria-hidden="true">SS</span><span data-role-label>Admin</span><span class="chevron" aria-hidden="true"></span></button>
        </div>
      </header>

      <main class="content">
        <section class="products-flow">
          <form class="page-panel" id="productForm">
            <h2 id="productFormTitle">Add Product</h2>
            <input id="productDocId" type="hidden">
            <div class="form-grid">
              <div class="field"><label for="name">Product Name</label><input id="name" placeholder="Enter product name" required></div>
              <div class="field"><label for="sku">SKU / ID</label><input id="sku" placeholder="Auto-generated" readonly></div>
              <div class="field"><label for="category">Category</label><input id="category" placeholder="Enter category" required></div>
              <div class="field"><label for="quantity">Quantity in Stock</label><input id="quantity" type="number" min="0" step="0.01" placeholder="0" required></div>
              <div class="field"><label for="unit">Unit</label><select id="unit" required><option value="pcs">pcs</option><option value="No">No</option><option value="Mtr">Mtr</option><option value="kg">kg</option><option value="g">g</option><option value="ltr">ltr</option><option value="ml">ml</option><option value="box">box</option><option value="pack">pack</option></select></div>
              <div class="field" data-price-only><label for="costPrice">Cost Price</label><input id="costPrice" type="number" min="0" step="0.01" placeholder="0" required></div>
              <div class="field" data-price-only><label for="sellingPrice">Selling Price</label><input id="sellingPrice" type="number" min="0" step="0.01" placeholder="0" required></div>
              <div class="field"><label for="lowStockLimit">Low Stock Alert</label><input id="lowStockLimit" type="number" min="0" step="0.01" placeholder="0"></div>
              <div class="field"><label for="productImage">Product Image</label><input id="productImage" type="file" accept="image/*"></div>
            </div>
            <div class="image-preview" id="imagePreview">No image selected</div>
            <p class="form-status" id="productStatus" role="status"></p>
            <div class="form-actions">
              <button class="primary-button" id="saveProductButton" type="submit">Save Product</button>
              <button class="secondary-button" id="cancelEditButton" type="button" hidden>Cancel Edit</button>
            </div>
          </form>

          <section class="inventory-panel">
            <div class="panel-header">
              <h2>Product List</h2>
              <button class="secondary-button small-button" id="importGovtProductsButton" type="button">Import Govt Price List</button>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>Image</th><th>Name</th><th>SKU</th><th>Category</th><th data-price-only>Price</th><th>Stock</th><th>Action</th></tr></thead>
                <tbody id="productTableBody"><tr><td class="empty-table" colspan="7">No products added yet.</td></tr></tbody>
              </table>
            </div>
          </section>
        </section>
      </main>
    </div>
  </div>
  <script src="firebase.js?v=20260509-mobile2"></script>
  <script src="auth.js?v=20260511-mobile-menu"></script>
  <script src="product-catalog.js?v=20260509-mobile2"></script>
  <script src="stock.js?v=20260509-mobile2"></script>
</body>
</html>
