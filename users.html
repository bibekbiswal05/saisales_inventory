<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Management | Sai Sales</title>
  <meta name="theme-color" content="#14945e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sai Sales">
  <link rel="manifest" href="manifest.json?v=20260511-pwa">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260511-pwa">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin-dashboard.css?v=20260516-add-user">
</head>
<body data-admin-page="true">
  <div class="admin-shell">
    <aside class="sidebar" aria-label="Users navigation">
      <div class="logo-wrap"><div class="logo-orbit" aria-hidden="true"></div></div>
      <nav class="side-nav">
        <a href="dashboard.html"><span class="nav-icon grid-icon" aria-hidden="true"></span><span>Dashboard</span></a>
        <a href="admin-dashboard.html"><span class="nav-icon chart-icon" aria-hidden="true"></span><span>Inventory</span></a>
        <a href="products.html"><span class="nav-icon book-icon" aria-hidden="true"></span><span>Products</span></a>
        <a href="suppliers.html" data-admin-only><span class="nav-icon supplier-icon" aria-hidden="true"></span><span>Suppliers</span></a>
        <a class="active" href="users.html" data-admin-only><span class="nav-icon staff-icon" aria-hidden="true"></span><span>Staff Management</span></a>
        <a href="stock-out.html"><span class="nav-icon cart-icon" aria-hidden="true"></span><span>Stock Out</span></a>
        <a href="stock-in.html"><span class="nav-icon safety-icon" aria-hidden="true"></span><span>Stock In</span></a>
        <a href="reports.html"><span class="nav-icon report-icon" aria-hidden="true"></span><span>Reports & Analysis</span></a>
        <a href="#" data-admin-only><span class="nav-icon settings-icon" aria-hidden="true"></span><span>Settings</span></a>
      </nav>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div><h1>Staff Management</h1><p>Manage roles and user access</p></div>
        <div class="top-actions">
          <button class="notification-button" type="button" aria-label="Notifications"><span></span></button>
        </div>
      </header>

      <main class="content">
        <section class="inventory-panel" data-admin-only>
          <div class="panel-header">
            <h2>Users</h2>
            <div class="panel-tools"><button class="add-button" id="showAddUserButton" type="button">+ Add User</button></div>
          </div>
          <form class="page-panel embedded-form" id="addUserForm" hidden>
            <div class="panel-header compact-header">
              <h2>Add User</h2>
              <button class="secondary-button small-button" id="cancelAddUserButton" type="button">Cancel</button>
            </div>
            <div class="form-grid">
              <div class="field"><label for="userName">Name</label><input id="userName" placeholder="Enter full name" required></div>
              <div class="field"><label for="userEmail">Email</label><input id="userEmail" type="email" placeholder="user@example.com" required></div>
              <div class="field"><label for="userPassword">Password</label><input id="userPassword" type="password" minlength="6" placeholder="Minimum 6 characters" required></div>
              <div class="field"><label for="userRole">Role</label><select id="userRole" required><option value="staff">Staff</option><option value="admin">Admin</option></select></div>
            </div>
            <p class="form-status" id="addUserStatus" role="status"></p>
            <div class="form-actions"><button class="primary-button" id="saveUserButton" type="submit">Save User</button></div>
          </form>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>User ID</th></tr></thead>
              <tbody id="userTableBody"><tr><td class="empty-table" colspan="5">No users loaded yet.</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="firebase.js?v=20260516-add-user"></script>
  <script src="auth.js?v=20260511-menu-logout"></script>
  <script src="users.js?v=20260516-users-list-all"></script>
  <script src="pwa.js?v=20260511-pwa"></script>
</body>
</html>
